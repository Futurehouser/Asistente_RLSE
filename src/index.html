<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Asistente deploy RLSE Aquaplus</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="theme-init.js"></script>
</head>
<body>
  <button id="themeToggle" class="theme-toggle" title="Cambiar modo día / noche" aria-label="Cambiar modo día / noche"></button>

  <div id="updateBanner" class="update-banner" hidden>
    <span id="updateText"></span>
    <button id="updateBtn" class="btn btn-small">Actualizar ahora</button>
  </div>

  <main class="container">
    <h1 class="title">Asistente deploy RLSE Aquaplus</h1>

    <section class="step" data-step="1">
      <div class="step-header"><span class="step-num">1</span><h2>Clonar plantilla</h2></div>
      <div class="row">
        <span class="label">Clona esta RLSE: </span>
        <a href="https://santander.service-now.com/now/nav/ui/classic/params/target/rm_release.do%3Fsys_id%3D09f6ac703333c750eb351b989d5c7bb6%26sysparm_domain%3Dnull%26sysparm_domain_scope%3Dnull%26sysparm_record_list%3Dsys_class_name%253drm_release%255eopened_by%253dcd7ec8dc8717b4589cda54673cbb35b3%255eu_segregation_restricted%253dfalse%255eu_segregation_domainsCONTAINS6b3fa9f887c3e990389dc9dc8bbb353f%255eORu_segregation_domainsCONTAINS7c0842bc1bea39105e74ec22604bcb39%255eORu_segregation_domainsCONTAINSf3f071348747e990389dc9dc8bbb3523%255eORu_segregation_domainsCONTAINS3db6322b1b5c21105ae05532604bcbec%255eORDERBYsys_created_on%255eORDERBYsys_id%26sysparm_record_row%3D11%26sysparm_record_rows%3D11%26sysparm_view%3Drelease%26sysparm_view_forced%3Dtrue%26sysparm_view_resolved%3Drelease" target="_blank" rel="noopener">Plantilla RLSE</a>
      </div>
      <img class="guide-img" src="img/clone-release.jpg" alt="Botón Clone Release en ServiceNow" />
    </section>

    <section class="step" data-step="2">
      <div class="step-header"><span class="step-num">2</span><h2>Descripción de la RLSE</h2></div>
      <div class="row">
        <label class="label" for="input1">Descripción resumida de alto nivel de la RLSE: </label>
        <textarea id="input1" rows="3"></textarea>
      </div>
      <div class="row">
        <label class="label" for="input2">Lista de HUs: </label>
        <textarea id="input2" rows="3"></textarea>
      </div>
      <div class="actions">
        <button id="generateBtn" class="btn">Generar descripciones</button>
      </div>
      <p class="hint">Copia esta descripción en la celda Description de la RLSE</p>
      <img class="guide-img" src="img/description.jpg" alt="Celda Description de la RLSE en ServiceNow" />
      <div class="output-wrap">
        <textarea id="output" rows="12" readonly placeholder="Aquí aparecerá la descripción generada"></textarea>
        <button id="copyBtn" class="btn btn-small btn-ghost copy-btn">Copiar</button>
      </div>
      <p class="hint hint-spaced">Copia este texto en el campo Justification de la RLSE</p>
      <img class="guide-img" src="img/justification.jpg" alt="Campo Justification en la pestaña Planning de la RLSE" />
      <div class="output-wrap">
        <textarea id="output2" rows="12" readonly placeholder="Aquí aparecerá la justificación generada"></textarea>
        <button id="copyBtn2" class="btn btn-small btn-ghost copy-btn">Copiar</button>
      </div>
    </section>

    <section class="step" data-step="3">
      <div class="step-header"><span class="step-num">3</span><h2>Fechas de despliegue</h2></div>
      <label class="block-label" for="deployDate">¿Qué día quieres desplegar la RLSE a PRO?</label>
      <div class="date-row">
        <input type="date" id="deployDate" />
        <button id="datesBtn" class="btn">Generar fechas</button>
      </div>
      <div id="datesOut" class="dates-out"></div>
    </section>
  </main>

  <nav class="step-nav">
    <button id="prevBtn" class="btn">&larr; Paso previo</button>
    <span id="stepIndicator" class="step-indicator"></span>
    <button id="nextBtn" class="btn">Paso siguiente &rarr;</button>
  </nav>

  <div id="version" class="version"></div>

  <script src="renderer.js"></script>
</body>
</html>
